# ============================================================
# SkyLogic MAS — Docker Compose Stack (CPU-Only)
# Services: PostGIS, Qdrant, FastAPI
# ============================================================

services:
  # --------------------------------------------------------
  # PostGIS — Spatial Metadata & Annotation Persistence
  # --------------------------------------------------------
  postgis:
    image: postgis/postgis:16-3.4
    container_name: skylogic-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skylogic}
      POSTGRES_USER: ${POSTGRES_USER:-skylogic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skylogic_secret}
    ports:
      - "${POSTGIS_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skylogic_user} -d ${POSTGRES_DB:-skylogic}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - skylogic-net

  # --------------------------------------------------------
  # Qdrant — Vector Similarity Search (SAM Embeddings)
  # --------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: skylogic-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_REST_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # Qdrant 1.7 image lacks wget/curl; use a TCP probe via bash /dev/tcp
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - skylogic-net

  # --------------------------------------------------------
  # FastAPI — SkyLogic MAS Backend (CPU-Only)
  # --------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skylogic-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-skylogic_user}:${POSTGRES_PASSWORD:-skylogic_secret}@postgis:5432/${POSTGRES_DB:-skylogic}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-1440}
      DATA_DIR: /app/data
      MODELS_DIR: /app/models
      TORCH_DEVICE: cpu
      SKYLOGIC_AUTO_SEED: "1"
      YOLO_WEIGHTS: /app/models/yolo/latest_best.pt
      SEGFORMER_WEIGHTS: /app/models/segformer/latest_best.pth
      SAM_CHECKPOINT: /app/models/sam/sam_vit_h_4b8939.pth
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Mount data + models so the host can update images / weights
      # without rebuilding the image. The skylogic/ package and
      # frontend/ are baked into the image (see .dockerignore).
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      postgis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - skylogic-net

volumes:
  postgis_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  skylogic-net:
    driver: bridge
